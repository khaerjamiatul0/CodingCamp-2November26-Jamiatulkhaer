<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="Segoe UI, system-ui, sans-serif">

  <!-- Background -->
  <rect width="900" height="720" fill="#0f1117"/>

  <!-- ── Greeting Card ── -->
  <rect x="20" y="20" width="860" height="120" rx="14" fill="#1a1d27" stroke="#2e3248" stroke-width="1"/>
  <text x="450" y="62" text-anchor="middle" font-size="15" fill="#6c63ff" font-weight="700">Good morning</text>
  <text x="540" y="62" text-anchor="start" font-size="15" fill="#e8eaf6" font-weight="400"> — have a great day!</text>
  <text x="450" y="100" text-anchor="middle" font-size="36" fill="#e8eaf6" font-weight="700" letter-spacing="2">10:24:05 AM</text>
  <text x="450" y="126" text-anchor="middle" font-size="13" fill="#8890a4">Friday, November 6, 2026</text>

  <!-- ── Focus Timer Card ── -->
  <rect x="20" y="160" width="420" height="240" rx="14" fill="#1a1d27" stroke="#2e3248" stroke-width="1"/>
  <text x="40" y="188" font-size="10" fill="#8890a4" font-weight="600" letter-spacing="2">FOCUS TIMER</text>

  <!-- Ring background -->
  <circle cx="230" cy="290" r="70" fill="none" stroke="#2e3248" stroke-width="6"/>
  <!-- Ring progress (about 80% full) -->
  <circle cx="230" cy="290" r="70" fill="none" stroke="#6c63ff" stroke-width="6"
          stroke-linecap="round" stroke-dasharray="440" stroke-dashoffset="88"
          transform="rotate(-90 230 290)"/>
  <!-- Time inside ring -->
  <text x="230" y="298" text-anchor="middle" font-size="22" fill="#e8eaf6" font-weight="700">20:12</text>

  <!-- Timer buttons -->
  <rect x="90"  y="355" width="80" height="30" rx="7" fill="#6c63ff"/>
  <text x="130" y="374" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">▶ Start</text>
  <rect x="180" y="355" width="80" height="30" rx="7" fill="#22263a" stroke="#2e3248" stroke-width="1"/>
  <text x="220" y="374" text-anchor="middle" font-size="12" fill="#e8eaf6" font-weight="600">⏸ Stop</text>
  <rect x="270" y="355" width="80" height="30" rx="7" fill="#22263a" stroke="#2e3248" stroke-width="1"/>
  <text x="310" y="374" text-anchor="middle" font-size="12" fill="#e8eaf6" font-weight="600">↺ Reset</text>

  <!-- ── Quick Links Card ── -->
  <rect x="460" y="160" width="420" height="240" rx="14" fill="#1a1d27" stroke="#2e3248" stroke-width="1"/>
  <text x="480" y="188" font-size="10" fill="#8890a4" font-weight="600" letter-spacing="2">QUICK LINKS</text>

  <!-- Input row -->
  <rect x="480" y="198" width="145" height="28" rx="7" fill="#22263a" stroke="#2e3248" stroke-width="1"/>
  <text x="492" y="216" font-size="11" fill="#8890a4">Label (e.g. YouTube)</text>
  <rect x="633" y="198" width="145" height="28" rx="7" fill="#22263a" stroke="#2e3248" stroke-width="1"/>
  <text x="645" y="216" font-size="11" fill="#8890a4">URL (e.g. youtube.com)</text>
  <rect x="786" y="198" width="74" height="28" rx="7" fill="#6c63ff"/>
  <text x="823" y="216" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">+ Add</text>

  <!-- Link chips -->
  <!-- YouTube -->
  <rect x="480" y="242" width="110" height="28" rx="14" fill="#22263a" stroke="#2e3248" stroke-width="1"/>
  <rect x="490" y="250" width="12" height="12" rx="2" fill="#ff0000"/>
  <text x="508" y="261" font-size="11" fill="#e8eaf6">YouTube</text>
  <text x="578" y="261" font-size="14" fill="#8890a4">×</text>

  <!-- GitHub -->
  <rect x="600" y="242" width="100" height="28" rx="14" fill="#22263a" stroke="#2e3248" stroke-width="1"/>
  <circle cx="614" cy="256" r="6" fill="#24292e" stroke="#ccc" stroke-width="1"/>
  <text x="626" y="261" font-size="11" fill="#e8eaf6">GitHub</text>
  <text x="688" y="261" font-size="14" fill="#8890a4">×</text>

  <!-- Google -->
  <rect x="480" y="280" width="100" height="28" rx="14" fill="#22263a" stroke="#2e3248" stroke-width="1"/>
  <rect x="490" y="288" width="12" height="12" rx="2" fill="#4285f4"/>
  <text x="508" y="299" font-size="11" fill="#e8eaf6">Google</text>
  <text x="568" y="299" font-size="14" fill="#8890a4">×</text>

  <!-- Twitter -->
  <rect x="590" y="280" width="100" height="28" rx="14" fill="#22263a" stroke="#2e3248" stroke-width="1"/>
  <rect x="600" y="288" width="12" height="12" rx="2" fill="#1da1f2"/>
  <text x="618" y="299" font-size="11" fill="#e8eaf6">Twitter</text>
  <text x="678" y="299" font-size="14" fill="#8890a4">×</text>

  <!-- ── To-Do List Card ── -->
  <rect x="20" y="420" width="860" height="280" rx="14" fill="#1a1d27" stroke="#2e3248" stroke-width="1"/>
  <text x="40" y="448" font-size="10" fill="#8890a4" font-weight="600" letter-spacing="2">TO-DO LIST</text>

  <!-- Input row -->
  <rect x="40"  y="458" width="720" height="32" rx="8" fill="#22263a" stroke="#2e3248" stroke-width="1"/>
  <text x="54"  y="478" font-size="12" fill="#8890a4">Add a new task and press Enter…</text>
  <rect x="770" y="458" width="90"  height="32" rx="8" fill="#6c63ff"/>
  <text x="815" y="478" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">+ Add</text>

  <!-- Task rows -->
  <!-- Task 1 - active -->
  <rect x="40" y="504" width="820" height="40" rx="8" fill="#22263a" stroke="#2e3248" stroke-width="1"/>
  <text x="60"  y="529" font-size="13" fill="#e8eaf6">Buy groceries</text>
  <text x="790" y="529" font-size="14" fill="#8890a4" font-weight="600">✓</text>
  <text x="818" y="529" font-size="14" fill="#8890a4">✎</text>
  <text x="845" y="529" font-size="14" fill="#8890a4">✕</text>

  <!-- Task 2 - done (strikethrough) -->
  <rect x="40" y="552" width="820" height="40" rx="8" fill="#22263a" stroke="#2e3248" stroke-width="1"/>
  <text x="60"  y="577" font-size="13" fill="#8890a4" text-decoration="line-through">Finish the project report</text>
  <line x1="60" y1="575" x2="228" y2="575" stroke="#8890a4" stroke-width="1.5"/>
  <text x="790" y="577" font-size="14" fill="#4caf7d" font-weight="600">↩</text>
  <text x="818" y="577" font-size="14" fill="#8890a4">✎</text>
  <text x="845" y="577" font-size="14" fill="#8890a4">✕</text>

  <!-- Task 3 - active -->
  <rect x="40" y="600" width="820" height="40" rx="8" fill="#22263a" stroke="#2e3248" stroke-width="1"/>
  <text x="60"  y="625" font-size="13" fill="#e8eaf6">Study JavaScript for 1 hour</text>
  <text x="790" y="625" font-size="14" fill="#8890a4" font-weight="600">✓</text>
  <text x="818" y="625" font-size="14" fill="#8890a4">✎</text>
  <text x="845" y="625" font-size="14" fill="#8890a4">✕</text>

  <!-- Task 4 - active -->
  <rect x="40" y="648" width="820" height="40" rx="8" fill="#22263a" stroke="#2e3248" stroke-width="1"/>
  <text x="60"  y="673" font-size="13" fill="#e8eaf6">Read 10 pages of a book</text>
  <text x="790" y="673" font-size="14" fill="#8890a4" font-weight="600">✓</text>
  <text x="818" y="673" font-size="14" fill="#8890a4">✎</text>
  <text x="845" y="673" font-size="14" fill="#8890a4">✕</text>

</svg>
